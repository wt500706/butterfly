<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FLY-C3RX BLE V12</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:white;font-family:Arial,sans-serif;touch-action:none;user-select:none}
#main{--gap:6px;--cell:min(calc((100vw - 28px)/3 * 1.5),calc((100dvh - 75px)/2.4));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:var(--cell) minmax(0,1fr) var(--cell);gap:var(--gap);width:100vw;height:100vh;height:100dvh;padding:38px 8px max(9px,env(safe-area-inset-bottom));min-height:0}
#main button{border:0;border-radius:12px;background:#34445c;color:white;font-size:clamp(25px,8vw,42px);touch-action:none;min-height:0;width:100%;height:100%}
#main button.on{background:#0284c7}
#main>button[data-key="5"]{grid-area:1/1}#main>button[data-key="1"]{grid-area:1/2}#main>button[data-key="7"]{grid-area:1/3}
#main>button[data-key="3"]{grid-area:2/1}#main>button[data-key="4"]{grid-area:2/3}
#main>button[data-key="6"]{grid-area:3/1}#main>button[data-key="2"]{grid-area:3/2}#main>button[data-key="8"]{grid-area:3/3}
#center{grid-area:2/2;display:flex;align-items:center;justify-content:center;flex-direction:column;min-width:0;min-height:0;gap:6px}
#label{white-space:nowrap;font-size:clamp(11px,3vw,15px);background:#101827bb;padding:2px 3px;border-radius:5px}
#track{flex:1;min-height:0;width:min(100%,90px);border-radius:55px;background:#34445c;border:2px solid #789;position:relative;touch-action:none}
#thumb{width:calc(100% - 12px);height:clamp(36px,9dvh,66px);position:absolute;left:6px;top:calc(100% - 76px);background:#39bdf8;color:#082032;border-radius:50px;display:grid;place-items:center;font-size:24px;font-weight:bold}
#status{position:absolute;top:5px;right:7px;font-size:11px;color:#facc15;background:#101827bb;padding:2px 4px;border-radius:4px;z-index:3;pointer-events:none}
@media(max-height:480px){#main{padding-top:32px;--cell:min(calc((100vw - 28px)/3 * 1.5),calc((100dvh - 60px)/2.5))}}
#settings{display:none;width:100vw;height:100dvh;overflow:auto;touch-action:pan-y;padding:32px 10px 12px;background:#101827}#fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}#fields label{display:flex;align-items:center;justify-content:space-between;gap:5px;background:#243247;border-radius:6px;padding:6px;font-size:12px}#fields input{width:75px;max-width:45%;padding:5px;color:white;background:#111827;border:1px solid #64748b;border-radius:5px;font-size:14px}#fields input[type=text]{width:115px;max-width:60%}#settings button{font-size:13px;padding:9px 12px;margin:6px 4px 0 0}.topbtn{position:fixed;top:3px;left:5px;z-index:5;font-size:12px;padding:5px 8px;background:#475569}#msg{font-size:12px;color:#93c5fd;padding:3px 4px}#status{right:6px;top:5px}#version-tag{position:fixed;bottom:max(2px,env(safe-area-inset-bottom));left:8px;z-index:30;font:600 11px Arial,sans-serif;color:#e2e8f0;background:#17253de8;border:1px solid #64748b;border-radius:5px;padding:3px 7px;pointer-events:none}</style></head><body><div id="version-tag">FLY-C3RX BLE V12 · 2026-10-27</div><button id="tab" class="topbtn">⚙ 校正</button><button id="connect" style="position:fixed;top:3px;left:86px;z-index:6;font-size:12px;padding:5px 8px;background:#087ca5;color:white;border:0;border-radius:6px">連線 BLE</button><span id="status">V12 載入中</span><div id="ble-error" style="display:none;position:fixed;z-index:20;top:42px;left:8px;right:8px;background:#7f1d1d;color:white;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:13px;pointer-events:none"></div><div id="main"><button data-key="5">↖</button><button data-key="1">↑</button><button data-key="7">↗</button><button data-key="3">←</button><div id="center"><div id="label">油門 <b id="n">0</b>/15</div><div id="track"><div id="thumb">0</div></div></div><button data-key="4">→</button><button data-key="6">↙</button><button data-key="2">↓</button><button data-key="8">↘</button></div><section id="settings"><div id="msg">讀取參數中…</div><div id="fields"></div><button id="reload">重新讀取</button><button id="save">儲存至 ESP32-C3</button><div style="font-size:11px;color:#a8b5c7">校正頁停止油門。修改後立即更新暫存設定，按儲存才寫入 Flash。變更名稱後，下次重新啟動使用新 BLE 名稱。</div></section><script>
const APP_VERSION='V12', APP_BUILD='2026-10-26';
const SERVICE=0x1234,CHAR=0x5678;
const keys=['device_name','left_center','right_center','up_angle','down_angle','min_hz','max_hz','k1_up','k1_down','k2_up','k2_down','k3_up','k3_down','k4_up','k4_down'];
const displayKeys=keys.filter(k=>k!=='device_name').concat('device_name');
const names={device_name:'蝴蝶名稱',left_center:'左翼基準角',right_center:'右翼基準角',up_angle:'上拍角度',down_angle:'下拍角度',min_hz:'最低拍頻 Hz',max_hz:'最高拍頻 Hz',k1_up:'K1 左Servo偏移',k1_down:'K1 右Servo偏移',k2_up:'K2 左Servo偏移',k2_down:'K2 右Servo偏移',k3_up:'K3 左Servo偏移',k3_down:'K4 右Servo偏移',k4_up:'K4 左Servo偏移',k4_down:'K4 右Servo偏移'};
names.k3_down='K3 右Servo偏移';
let device=null,ch=null,speed=0,key=0,page='flight',busy=false,configReady=false,values={},readDone=null,waiters=[],switching=false,writing=Promise.resolve(),readTimer=null;
const track=document.getElementById('track'),thumb=document.getElementById('thumb'),status=document.getElementById('status'),msg=document.getElementById('msg'),fields=document.getElementById('fields');
function show(){const max=Math.max(0,track.clientHeight-thumb.clientHeight-12);thumb.style.top=(6+max*(1-speed/15))+'px';thumb.textContent=speed;document.getElementById('n').textContent=speed}
function reset(){speed=0;key=0;show();document.querySelectorAll('[data-key]').forEach(b=>b.classList.remove('on'))}
function throttle(e){let r=track.getBoundingClientRect();let f=1-(e.clientY-r.top-thumb.clientHeight/2)/(r.height-thumb.clientHeight);speed=Math.max(0,Math.min(15,Math.round(f*15)));show()}
track.addEventListener('pointerdown',e=>{e.preventDefault();track.setPointerCapture(e.pointerId);throttle(e)});
track.addEventListener('pointermove',e=>{if(track.hasPointerCapture(e.pointerId))throttle(e)});
document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);key=+b.dataset.key;b.classList.add('on')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(key===+b.dataset.key)key=0;b.classList.remove('on')})});
// All writes share one serial pipeline; do not overlap BLE GATT operations.
function write(s){
  const job=writing.catch(()=>{}).then(async()=>{
    if(!ch||!device||!device.gatt.connected)throw Error('未連線');
    await ch.writeValueWithResponse(new TextEncoder().encode(s));
  });
  writing=job.catch(()=>{});
  return job;
}
async function queue(s){if(busy)return;busy=true;try{await write(s)}catch(e){status.textContent='傳送失敗：'+e.message;status.style.color='#fca5a5'}finally{busy=false}}
setInterval(()=>{if(ch&&page==='flight'&&!switching&&!busy)queue('C,'+speed+','+key)},100);
function notify(e){
  const s=new TextDecoder().decode(e.target.value).trim();
  if(s.startsWith('V,')){
    const p=s.split(',');const i=Number(p[1]);
    if(readDone&&Number.isInteger(i)&&i>=0&&i<keys.length)values[keys[i]]=p.slice(2).join(',');
  }else if(s==='DONE'){
    if(readDone){const done=readDone;readDone=null;done();}
  }else{
    const w=waiters.shift();if(w)w(s);
  }
}
function ack(s){
  return new Promise((resolve,reject)=>{
    let timer;
    const handler=r=>{clearTimeout(timer);resolve(r)};
    waiters.push(handler);
    timer=setTimeout(()=>{const i=waiters.indexOf(handler);if(i>=0)waiters.splice(i,1);reject(Error('等待回覆逾時：'+s))},3000);
    write(s).catch(e=>{clearTimeout(timer);const i=waiters.indexOf(handler);if(i>=0)waiters.splice(i,1);reject(e)});
  });
}
function validField(k,v){
  if(k==='device_name')return typeof v==='string'&&v.length>0&&new TextEncoder().encode(v).length<=20;
  if(v===undefined||v===null||String(v).trim()==='')return false;
  const n=Number(v);if(!Number.isFinite(n))return false;
  if(k==='min_hz'||k==='max_hz')return n>=0.1&&n<=5;
  if(!Number.isInteger(n))return false;
  if(k==='left_center'||k==='right_center')return n>=20&&n<=160;
  if(k==='up_angle'||k==='down_angle')return n>=0&&n<=90;
  return n>=-40&&n<=40;
}
document.getElementById('connect').onclick=async()=>{
  // requestDevice 必須直接由使用者點擊觸發，前面不能有 alert 或 await
  let stage='搜尋裝置';
  document.getElementById('ble-error').style.display='none';
  status.textContent='V12 正在搜尋 BLE';
  try {
    if (!navigator.bluetooth) throw new Error('此瀏覽器不支援 Web Bluetooth，請使用 Android Chrome 的 HTTPS 頁面');
    device=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'Butterfly_'}],
      optionalServices:[SERVICE]
    });
    stage='GATT 連線';
    status.textContent='正在連線 GATT';
    device.addEventListener('gattserverdisconnected',()=>{
      ch=null;configReady=false;readDone=null;waiters=[];reset();status.textContent='已斷線';status.style.color='#fca5a5';
    });
    const server=await device.gatt.connect();
    stage='取得 Service';
    const service=await server.getPrimaryService(SERVICE);
    stage='取得 Characteristic';
    ch=await service.getCharacteristic(CHAR);
    stage='啟動通知';
    ch.addEventListener('characteristicvaluechanged',notify);
    await ch.startNotifications();
    status.textContent='V12 已連線';status.style.color='#86efac';reset();
  } catch(e) {
    ch=null;
    status.textContent='V12 連線失敗：'+(e.name||'Error');
    status.style.color='#fca5a5';
    const details='失敗階段：'+stage+'\n錯誤類型：'+(e.name||'Error')+'\n錯誤內容：'+(e.message||String(e));
    document.getElementById('ble-error').textContent=details;
    document.getElementById('ble-error').style.display='block';
    alert(details);
  }
};
async function loadConfig(){
  if(!ch){msg.textContent='請先連線 BLE';return}
  if(readDone){msg.textContent='讀取進行中，請稍候';return}
  configReady=false;values={};fields.innerHTML='';
  document.getElementById('save').disabled=true;
  msg.textContent='正在讀取 ESP32-C3 參數…';
  try{
    await new Promise((resolve,reject)=>{
      readDone=resolve;
      readTimer=setTimeout(()=>{if(readDone){readDone=null;reject(Error('讀取逾時'))}},6000);
      write('G').catch(e=>{readDone=null;reject(e)});
    });
    clearTimeout(readTimer);
    const missing=keys.filter(k=>!validField(k,values[k]));
    if(missing.length)throw Error('資料不完整或錯位：'+missing.map(k=>names[k]).join('、')+'；禁止儲存，請重新讀取');
    if(Number(values.min_hz)>Number(values.max_hz))throw Error('拍頻設定不正確；禁止儲存');
    for(const k of displayKeys){
      const label=document.createElement('label'),span=document.createElement('span'),input=document.createElement('input');
      span.textContent=names[k];input.type=k==='device_name'?'text':'number';
      input.step=k.includes('hz')?'0.1':'1';input.value=values[k];
      input.onchange=async()=>{
        if(!validField(k,input.value)){msg.textContent='數值範圍錯誤：'+names[k];input.value=values[k];return}
        const candidate={...values,[k]:input.value};
        if(Number(candidate.min_hz)>Number(candidate.max_hz)){msg.textContent='最低拍頻不可大於最高拍頻';input.value=values[k];return}
        try{
          const r=await ack('S,'+keys.indexOf(k)+','+input.value);
          if(r!=='OK,S,'+keys.indexOf(k))throw Error(r);
          values[k]=input.value;msg.textContent='已更新暫存設定，尚未儲存';
        }catch(e){msg.textContent='設定失敗：'+e.message;input.value=values[k]}
      };
      label.append(span,input);fields.append(label);
    }
    configReady=true;document.getElementById('save').disabled=false;
    msg.textContent='讀取成功（15 項，已驗證）';
  }catch(e){
    clearTimeout(readTimer);readDone=null;configReady=false;
    msg.textContent='讀取失敗：'+e.message;
  }
}
document.getElementById('tab').onclick=async()=>{
  if(switching)return;
  switching=true;reset();
  try{
    if(page==='flight'){
      if(!ch){alert('請先連線 BLE');return}
      await write('C,0,0');
      const r=await ack('M,1');if(r!=='OK,M')throw Error('未收到 OK,M：'+r);
      page='settings';document.getElementById('main').style.display='none';
      document.getElementById('settings').style.display='block';
      document.getElementById('tab').textContent='← 飛行';
      await loadConfig();
    }else{
      const r=await ack('M,0');if(r!=='OK,M')throw Error('未收到 OK,M：'+r);
      page='flight';document.getElementById('main').style.display='grid';
      document.getElementById('settings').style.display='none';
      document.getElementById('tab').textContent='⚙ 校正';
      reset();requestAnimationFrame(()=>requestAnimationFrame(show));
    }
  }catch(e){alert('切換失敗：'+e.message)}
  finally{switching=false}
};
document.getElementById('reload').onclick=loadConfig;
document.getElementById('save').onclick=async()=>{
  if(!configReady){msg.textContent='資料未完整驗證，禁止儲存';return}
  try{const r=await ack('W');msg.textContent=r==='OK,W'?'已儲存至 ESP32-C3':'儲存失敗：'+r}
  catch(e){msg.textContent='儲存失敗：'+e.message}
};
document.addEventListener('visibilitychange',()=>{if(document.hidden){reset();if(ch)write('C,0,0').catch(()=>{})}});window.addEventListener('resize',show);show();status.textContent='V12 已啟動';
</script></body></html>
